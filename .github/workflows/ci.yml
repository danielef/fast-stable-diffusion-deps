name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Tier 1: dep install + import smoke test (no GPU needed)
  # ------------------------------------------------------------------
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/forge.txt

      - name: Install system deps
        run: sudo apt-get install -y libavif-dev

      - name: Install deps
        run: |
          pip install --upgrade pip
          # CPU torch first — torch-dependent packages (kornia, torchdiffeq, etc.) need it present
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/forge.txt

      - name: Import smoke test
        run: |
          python -c "
          import gradio, transformers, diffusers, accelerate
          import numpy, einops, omegaconf, safetensors
          import kornia, spandrel
          import git
          import pytorch_lightning
          print('✓ All imports OK')
          print(f'  gradio              {gradio.__version__}')
          print(f'  transformers        {transformers.__version__}')
          print(f'  numpy               {numpy.__version__}')
          print(f'  diffusers           {diffusers.__version__}')
          print(f'  pytorch_lightning   {pytorch_lightning.__version__}')
          "

  # ------------------------------------------------------------------
  # Build + publish the blob on every push to main (after PR merge).
  # Requires the smoke test to pass first.
  # The semantic-release step creates the Git tag; the upload step
  # attaches the blob as a release asset.
  # ------------------------------------------------------------------
  release:
    name: Build blob + release
    needs: smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # needed to create releases

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # semantic-release needs full history
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/forge.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --save-dev \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git
          # Capture the latest tag before running so we can detect if a new one is created.
          TAG_BEFORE=$(git tag --sort=-v:refname | head -1)
          npx semantic-release
          TAG_AFTER=$(git tag --sort=-v:refname | head -1)
          if [ "$TAG_AFTER" != "$TAG_BEFORE" ] && [ -n "$TAG_AFTER" ]; then
            echo "new_release_published=true"  >> "$GITHUB_OUTPUT"
            echo "new_release_version=${TAG_AFTER#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system deps
        if: steps.semrel.outputs.new_release_published == 'true'
        run: sudo apt-get install -y libavif-dev

      - name: Install deps for blob build
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          pip install --upgrade pip
          # Install torch CPU-only just to satisfy import checks in build script
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/forge.txt

      - name: Prepare blob target directory
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          PY_VER=$(python3 -c "import sys; print(f'python{sys.version_info.major}.{sys.version_info.minor}')")
          sudo mkdir -p "/usr/local/lib/${PY_VER}/dist-packages"
          sudo chown -R "$USER" "/usr/local/lib/${PY_VER}"

      - name: Build blob
        if: steps.semrel.outputs.new_release_published == 'true'
        run: bash scripts/build_blob.sh

      - name: Upload blob to release
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.semrel.outputs.new_release_version }}
          gh release upload "v${VERSION}" gcolabdeps_forge.tar.zst --clobber

      # The notebook repo's Renovate config watches this repo's GitHub Releases
      # and opens a PR automatically when a new version is published.
